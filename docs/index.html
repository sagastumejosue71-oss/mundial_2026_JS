<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ Mundial 2026</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--green:#00a651;--green2:#007a3d;--green3:#004d26;--gold:#d4a017;--red:#e63946;--dark:#f4f7fb;--dark2:#ffffff;--dark3:#eef3f8;--dark4:#dbe4ee;--text:#10213a;--text2:#5b6b7e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dark);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.app-header{background:linear-gradient(135deg,#e8f7ef 0%,#dff6e9 50%,#e8f7ef 100%);border-bottom:2px solid var(--gold);padding:10px 16px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,100,50,.12)}
.header-title{font-size:20px;font-weight:700;color:var(--green3)}
.header-sub{font-size:11px;color:#4b5f70;margin-top:1px}
.live-btn{display:flex;align-items:center;gap:6px;background:rgba(0,166,81,.12);border:1px solid rgba(0,166,81,.25);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--green3);cursor:pointer;transition:.2s;font-family:inherit}
.live-btn:hover{background:rgba(0,166,81,.2)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0}
.live-dot.pulse{animation:lpulse 1.4s ease-in-out infinite}
.live-dot.spinning{background:transparent;border:2px solid #22c55e;border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes lpulse{0%,100%{opacity:1;box-shadow:0 0 4px #6fff6f}50%{opacity:.3;box-shadow:0 0 14px #6fff6f}}
@keyframes spin{to{transform:rotate(360deg)}}

.app-tabs{background:var(--dark2);border-bottom:1px solid var(--dark4);display:flex;position:sticky;top:61px;z-index:99;overflow-x:auto;scrollbar-width:none}
.app-tabs::-webkit-scrollbar{display:none}
.app-tab{flex:1;min-width:60px;border:none;background:none;color:var(--text2);font-size:12px;font-weight:600;padding:11px 4px;cursor:pointer;border-bottom:3px solid transparent;transition:.2s;font-family:inherit;white-space:nowrap}
.app-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.app-tab:hover:not(.active){color:var(--text)}

.sec{display:none;padding:12px;max-width:480px;margin:0 auto;padding-bottom:40px}
.sec.active{display:block}

/* MATCH CARD */
.mc{background:var(--dark2);border:1px solid var(--dark4);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.mc:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mc.is-today{border-color:rgba(0,166,81,.5);box-shadow:0 0 0 1px rgba(0,166,81,.3)}
.mc.is-live{border-color:var(--red);animation:liveborder 2s ease-in-out infinite}
@keyframes liveborder{0%,100%{box-shadow:0 0 0 1px var(--red),0 4px 16px rgba(230,57,70,.15)}50%{box-shadow:0 0 0 2px var(--red),0 4px 24px rgba(230,57,70,.4)}}

.mc-top{display:flex;justify-content:space-between;align-items:center;padding:7px 13px;background:var(--dark3);font-size:11px}
.spill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.sp-g{background:rgba(0,166,81,.2);color:#6fff9f;border:1px solid rgba(0,166,81,.3)}
.sp-32{background:rgba(33,146,255,.2);color:#82cbff;border:1px solid rgba(33,146,255,.3)}
.sp-16{background:rgba(168,85,247,.2);color:#d8a8ff;border:1px solid rgba(168,85,247,.3)}
.sp-qf{background:rgba(255,184,0,.2);color:#ffe066;border:1px solid rgba(255,184,0,.3)}
.sp-sf{background:rgba(255,100,0,.2);color:#ffb366;border:1px solid rgba(255,100,0,.3)}
.sp-fn{background:rgba(230,57,70,.2);color:#ff8a8a;border:1px solid rgba(230,57,70,.4)}
.live-tag{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;animation:ltag 1s ease-in-out infinite}
@keyframes ltag{0%,100%{opacity:1}50%{opacity:.5}}

.mc-body{padding:14px}
.teams{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.team{text-align:center;flex:1;min-width:0}
.flag-img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--dark4);display:block;margin:0 auto 5px;background:var(--dark3)}
.tname{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-wrap{text-align:center;min-width:76px}
.sc-num{font-size:30px;font-weight:700;color:var(--gold);letter-spacing:-1px;text-shadow:0 0 18px rgba(255,215,0,.3)}
.sc-dash{font-size:24px;color:var(--text2);margin:0 3px}
.sc-time{font-size:13px;color:var(--text2);margin-top:3px}
.sc-live{font-size:11px;color:var(--red);font-weight:700;margin-top:1px}

.venue{font-size:11px;color:var(--text2);text-align:center;margin-bottom:10px}

.pred-box{background:var(--dark3);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.pred-lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.pred-bars{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:4px}
.pseg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.pw{background:linear-gradient(90deg,#006630,#00c861)}
.pd{background:linear-gradient(90deg,#444c58,#5a6270)}
.pl{background:linear-gradient(90deg,#a01020,#e63946)}
.pred-names{display:flex;justify-content:space-between;font-size:10px;color:var(--text2)}

.live-box{background:linear-gradient(135deg,rgba(230,57,70,.12),rgba(255,100,0,.08));border:1px solid rgba(230,57,70,.35);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.live-box-lbl{font-size:10px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.live-box-txt{font-size:13px;color:var(--text);line-height:1.5}

.alarm{font-size:11px;color:var(--green);margin-top:6px;display:flex;align-items:center;gap:5px}

/* FILTERS */
.fscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;font-size:11px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid var(--dark4);background:var(--dark2);color:var(--text2);cursor:pointer;transition:.2s;font-family:inherit}
.fchip.active{background:var(--green);color:#fff;border-color:var(--green)}
.fchip:hover:not(.active){border-color:var(--text2);color:var(--text)}

.sbox{width:100%;background:var(--dark2);border:1px solid var(--dark4);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--text);margin-bottom:12px;font-family:inherit;transition:.2s}
.sbox:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(0,166,81,.15)}
.sbox::placeholder{color:var(--text2)}

/* BRACKET */
.bm{background:var(--dark2);border:1px solid var(--dark4);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:.2s}
.bm:hover{border-color:rgba(255,215,0,.4)}
.bt{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px}
.bt.win{color:var(--gold);font-weight:700}
.bs{font-weight:700;font-size:15px;min-width:18px;text-align:right}
.bmeta{font-size:10px;color:var(--text2);margin-top:5px}
.tbd{color:var(--dark4);font-style:italic}

/* STATS */
.sc{background:var(--dark2);border:1px solid var(--dark4);border-radius:14px;padding:16px;text-align:center;transition:.2s}
.sc:hover{border-color:var(--green);box-shadow:0 0 16px rgba(0,166,81,.15)}
.sn{font-size:30px;font-weight:700;color:var(--gold);line-height:1}
.sl{font-size:11px;color:var(--text2);margin-top:4px}

/* INFO */
.ibox{border-radius:12px;padding:11px 14px;margin-bottom:12px;border:1px solid}
.ig{background:rgba(0,166,81,.1);border-color:rgba(0,166,81,.3)}
.ir{background:rgba(230,57,70,.1);border-color:rgba(230,57,70,.3)}
.igo{background:rgba(255,215,0,.07);border-color:rgba(255,215,0,.25)}
.ip{background:rgba(168,85,247,.1);border-color:rgba(168,85,247,.3)}
.ibox h3{font-size:13px;font-weight:700;margin-bottom:3px}
.ibox p{font-size:12px;color:var(--text2);line-height:1.5;margin:0}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{background:var(--dark2);border:1px solid var(--dark4);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.history-item .hi-teams{display:flex;flex-direction:column;gap:2px;min-width:0}
.history-item .hi-team{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .hi-meta{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.history-score{font-size:16px;font-weight:700;color:var(--gold);white-space:nowrap}

.sec-ttl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 8px 2px}
.empty{text-align:center;color:var(--text2);padding:40px 0}
.timeline{position:relative;padding-left:18px;margin-top:6px}
.timeline:before{content:'';position:absolute;left:7px;top:2px;bottom:2px;width:2px;background:linear-gradient(180deg,var(--green),rgba(0,166,81,.18))}
.timeline-item{position:relative;padding:0 0 12px 14px}
.timeline-item:last-child{padding-bottom:0}
.timeline-item:before{content:'';position:absolute;left:-3px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--dark2);box-shadow:0 0 0 2px rgba(0,166,81,.15)}
.timeline-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.timeline-min{font-size:11px;font-weight:700;color:var(--gold)}
.timeline-card{background:var(--dark3);border:1px solid var(--dark4);border-radius:10px;padding:10px 11px}
.timeline-type{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.timeline-text{font-size:12px;color:var(--text);line-height:1.4}
</style>
</head>

const TEAM_ALIASES_REV=Object.fromEntries(Object.entries(TEAM_ALIASES).map(([es,en])=>[en,es]));
function toSpanishTeam(name){return TEAM_ALIASES_REV[name]||name;}
// Reemplazo simple de nombres de equipo en texto libre en ingles (ej. notas
// del VAR: "VAR Decision: No Goal Portugal 2-1 Croatia") por el nombre en
// español que usa el resto de la app.
function toSpanishText(text){
  let out=text||'';
  Object.entries(TEAM_ALIASES_REV).forEach(([en,es])=>{
    if(en===es) return;
    out=out.split(en).join(es);
  });
  return out;

// ===== UTILS =====
// Escapa texto antes de insertarlo en innerHTML/atributos. Se usa tanto para
// texto propio del usuario (ej. la casilla de busqueda) como para cualquier
// texto que venga de ESPN (nombres, detalles de estado, jugadas), ya que ese
// texto es de un tercero y no deberia poder inyectar HTML.
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const fmtD=d=>{const[,m,dy]=d.split('-');return `${parseInt(dy)} ${MONTHS[parseInt(m)]}`;};
const gtT=t=>{const[h,m]=t.split(':').map(Number);let g=h-2;if(g<0)g+=24;return `${String(g).padStart(2,'0')}:${String(m).padStart(2,'0')}`;};
const alarmT=t=>{const[h,m]=t.split(':').map(Number);let tot=h*60+m-40-120;if(tot<0)tot+=1440;return `${String(Math.floor(tot/60)).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}`;};
const played=x=>x.hr!==null&&x.ar!==null;
function fmtClock(status){
  const display=(status?.displayClock||'').trim();
  if(display) return escapeHtml(display);
  const raw=Number(status?.clock ?? 0);
  if(!Number.isFinite(raw) || raw<=0) return '';
  return `${Math.floor(raw/60)}'`;
}
function normalizeTeam(value){
  return (value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
}
function getEspnTeamName(name){return TEAM_ALIASES[name]||name;}
function findEspnMatch(homeName, awayName){
  const targetHome=normalizeTeam(getEspnTeamName(homeName));
  const targetAway=normalizeTeam(getEspnTeamName(awayName));
  const events=window.__espnLiveEvents||[];
  return events.find(event=>{
    const comp=event?.competitions?.[0];
    const teams=comp?.competitors||[];
    const home=teams.find(t=>t.homeAway==='home')?.team?.displayName || teams[0]?.team?.displayName || '';
    const away=teams.find(t=>t.homeAway==='away')?.team?.displayName || teams[1]?.team?.displayName || '';
    return normalizeTeam(home)===targetHome && normalizeTeam(away)===targetAway;
  });
}
function pred(x){
  if(x.ph>=50)return{w:x.h,s:`${Math.round(x.ph/30+.4)}-${Math.round(x.pa/35)}`,c:x.ph};
  if(x.pa>=50)return{w:x.a,s:`${Math.round(x.pa/35)}-${Math.round(x.ph/30+.4)}`,c:x.pa};
  return{w:'Empate',s:'1-1',c:x.pd};
}
function compareMatchDate(a,b){
  const av=new Date(`${a.date}T${a.time}:00`);
  const bv=new Date(`${b.date}T${b.time}:00`);
  return av-bv;
}
function ensureHistoryEntry(match){
  if(!match || !played(match)) return;
  if(historyMatches.some(h=>h.id===match.id)) return;
  historyMatches.push({...match});
  historyMatches.sort((a,b)=>compareMatchDate(b,a));
}

  {from:101,to:104,slot:'h',loserTo:103,loserSlot:'h'},
  {from:102,to:104,slot:'a',loserTo:103,loserSlot:'a'},
];
function advanceBracket(){
  let changed=false;
  BRACKET_ADVANCE.forEach(rule=>{
    const src=M.find(m=>m.id===rule.from);
    if(!src||!played(src)) return;
    // src.win lo llena fetchLive con el "winner" real de ESPN, que ya
    // resuelve empates definidos en penales. Si no esta disponible (dato
    // cargado a mano) se usa el marcador; un empate sin src.win significa
    // que el cruce se fue a penales y todavia no sabemos quien gano.
    let winSlot=src.win || (src.hr>src.ar?'h':src.ar>src.hr?'a':null);
    if(!winSlot) return;
    const winner=winSlot==='h'?src.h:src.a;
    const loser=winSlot==='h'?src.a:src.h;
    const target=M.find(m=>m.id===rule.to);
    if(target&&target[rule.slot]!==winner){target[rule.slot]=winner;changed=true;}
    if(rule.loserTo){
      const loserTarget=M.find(m=>m.id===rule.loserTo);
      if(loserTarget&&loserTarget[rule.loserSlot]!==loser){loserTarget[rule.loserSlot]=loser;changed=true;}
    }
  });
  return changed;
}

// ===== PERSISTENCIA: guarda en el navegador los resultados que ya se
// confirmaron via ESPN, para que no se pierdan al recargar la pagina =====
const RESULTS_KEY='wc2026_results_v1';
function applyResults(stored){
  let changed=false;
  M.forEach(x=>{
    const s=stored[x.id];
    if(s&&s.hr!=null&&s.ar!=null&&(x.hr!==s.hr||x.ar!==s.ar||x.win!==s.win)){
      x.hr=s.hr;x.ar=s.ar;
      if(s.win!=null)x.win=s.win;
      if(s.hp!=null)x.hp=s.hp;
      if(s.ap!=null)x.ap=s.ap;
      changed=true;
    }
  });
  return changed;
}
function loadStoredResults(){
  try{
    const raw=localStorage.getItem(RESULTS_KEY);
    if(!raw)return;
    applyResults(JSON.parse(raw));
  }catch(e){}
}
function saveStoredResult(x){
  try{
    const raw=localStorage.getItem(RESULTS_KEY);
    const stored=raw?JSON.parse(raw):{};
    stored[x.id]={hr:x.hr,ar:x.ar,win:x.win??null,hp:x.hp??null,ap:x.ap??null};
    localStorage.setItem(RESULTS_KEY,JSON.stringify(stored));
  }catch(e){}
}

// ===== RESULTADOS COMPARTIDOS: un workflow de GitHub Actions consulta ESPN
// periodicamente y publica data/results.json, para que todas las personas
// que visitan la app vean los mismos resultados (no solo quien lo vio en
// vivo en su propio navegador) =====
const SHARED_RESULTS_URL='https://sagastumejosue71-oss.github.io/mundial_2026_JS/data/results.json';
async function loadSharedResults(){
  try{
    const res=await fetch(`${SHARED_RESULTS_URL}?t=${Date.now()}`,{cache:'no-store'});
    if(!res.ok)return false;
    const stored=await res.json();
    return applyResults(stored);
  }catch(e){
    console.warn('No se pudo cargar data/results.json compartido:',e);
    return false;
  }
}

function card(x, alarm=false){
  const today=new Date().toISOString().slice(0,10);
  const p=played(x), lv=liveData[x.id], meta=liveMeta[x.id]||{}, isToday=x.date===today;

  // escapeHtml antes de guardarse en liveData; sin esta alternativa la
  // insignia "EN VIVO" dejaba de encenderse durante un partido en curso.
  const isLiveNow=lv&&/(en curso|min\s*\d|'|&#39;|\bvs\b.*en\s+juego)/i.test(lv);
  const pr=pred(x);
  const pill=STAGE_PILL[x.stage]||'sp-g';
  const sn=STAGE_NAME[x.stage]+(x.group?` · Gr.${x.group}`:'');
  let cls='mc'+(isLiveNow?' is-live':isToday&&!p?' is-today':'');

  const scoreH=p
    ?`<div style="display:flex;align-items:center;justify-content:center;gap:4px">
        <span class="sc-num">${x.hr}</span>

        <span class="sc-num">${x.ar}</span>
       </div><div style="font-size:11px;color:#8b949e;margin-top:2px">Final${x.hr===x.ar&&x.hp!=null&&x.ap!=null?` · Penales ${x.hp}-${x.ap}`:''}</div>`
    :meta.score
      ?`<div style="display:flex;align-items:center;justify-content:center;gap:4px">
          <span class="sc-num">${meta.score.home}</span>
          <span class="sc-dash">-</span>

         </div><div class="sc-live">● ${meta.minute || 'EN CURSO'}</div>`
      :`<div class="sc-time">${gtT(x.time)} <span style="font-size:10px;color:#8b949e">GT</span></div>
        ${isLiveNow?'<div class="sc-live">● EN CURSO</div>':''}`;

  const movement=meta.latestAction || meta.summary || '';
  const liveBox=lv?`<div class="live-box"><div class="live-box-lbl"><i class="bi bi-broadcast"></i> En vivo</div><div class="live-box-txt">${lv}</div>${meta.summary?`<div class="live-box-txt" style="margin-top:6px;font-size:12px;color:var(--text2)">${meta.summary}</div>`:''}${movement && movement!==meta.summary?`<div class="live-box-txt" style="margin-top:6px;font-size:12px;color:var(--gold)">Último movimiento: ${movement}</div>`:''}</div>`:'';
  const alBox=alarm&&!p?`<div class="alarm"><i class="bi bi-bell-fill"></i> Alarma: ${alarmT(x.time)} GT (40 min antes)</div>`:'';

  return `<div class="${cls}" id="mc${x.id}" onclick="openLiveView(${x.id})" style="cursor:pointer">

        ${isLiveNow?'<span class="live-tag"><i class="bi bi-broadcast"></i> VIVO</span>':''}
        <span style="font-size:11px;color:#8b949e">${fmtD(x.date)}</span>
      </div>
    </div>
    <div class="mc-body">
      <div class="teams">
        <div class="team">${flagImg(x.h)}<div class="tname">${x.h}</div></div>
        <div class="sc-wrap">${scoreH}</div>
        <div class="team">${flagImg(x.a)}<div class="tname">${x.a}</div></div>
      </div>
      <div class="venue"><i class="bi bi-geo-alt"></i> ${x.venue}</div>
      <div class="pred-box">
        <div class="pred-lbl"><i class="bi bi-graph-up"></i> Probabilidad estadística</div>
        <div class="pred-bars">
          <div class="pseg pw" style="width:${x.ph}%">${x.ph>18?x.ph+'%':''}</div>
          <div class="pseg pd" style="width:${x.pd}%">${x.pd>12?x.pd+'%':''}</div>
          <div class="pseg pl" style="width:${x.pa}%">${x.pa>18?x.pa+'%':''}</div>

function translateEventText(text){
  const t=(text||'').trim();
  if(!t) return '';
  return t
    .replace(/\bis shown the yellow card\b/gi,'recibe la tarjeta amarilla')
    .replace(/\bis shown the red card\b/gi,'recibe la tarjeta roja')
    .replace(/\bfor a bad foul\b/gi,'por una falta dura')
    .replace(/\breplaces\b/gi,'reemplaza a')
    .replace(/\bbecause of an injury\b/gi,'por una lesión')
    .replace(/\bDelay in match\b/gi,'Pausa en el partido')
    .replace(/\bDelay over\.? They are ready to continue\.?\b/gi,'Se reanuda el juego.')
    .replace(/\bconverts the penalty with a\b/gi,'convierte el penal con un')
    .replace(/\bright footed shot\b/gi,'disparo de derecha')
    .replace(/\bleft footed shot\b/gi,'disparo de izquierda')
    .replace(/\bfrom the centre of the box\b/gi,'desde el centro del área')
    .replace(/\bto the centre of the goal\b/gi,'al centro del arco')
    .replace(/\bAssisted by\b/gi,'Asistencia de')
    .replace(/\bYellow card\b/gi,'Tarjeta amarilla')
    .replace(/\bRed card\b/gi,'Tarjeta roja')
    .replace(/\bGoal\b/gi,'Gol')
    .replace(/\bGoal scored\b/gi,'Gol anotado')
    .replace(/\bSubstitution\b/gi,'Cambio')
    .replace(/\bFoul\b/gi,'Falta')
    .replace(/\bFree kick\b/gi,'Tiro libre')
    .replace(/\bOffside\b/gi,'Fuera de juego')
    .replace(/\bPenalty\b/gi,'Penal')
    .replace(/\bCorner\b/gi,'Esquina')
    .replace(/\bOwn goal\b/gi,'Autogol')
    .replace(/\bAssist\b/gi,'Asistencia')
    .replace(/\bHalftime\b/gi,'Entretiempo')
    .replace(/\bBreak\b/gi,'Descanso')
    .replace(/\bInjury time\b/gi,'Tiempo añadido')
    .replace(/\bShot\b/gi,'Disparo');
}
// Construye una descripcion especifica y con emocion para cada jugada,
// usando los campos estructurados que manda ESPN (tipo de jugada, equipo y
// jugadores involucrados) en vez de traducir a lo bruto el texto en ingles.
function describeEvent(ev){
  const slug=ev.slug||'';
  const team=ev.team||'';
  const [p1,p2]=ev.participants||[];
  const raw=ev.text||'';

  if(slug==='kickoff') return {label:'Arranca',color:'var(--green)',text:'🟢 ¡Rueda el balón! Arranca el partido.'};
  if(slug==='start-2nd-half') return {label:'2do tiempo',color:'var(--green)',text:'🟢 ¡Arranca el segundo tiempo!'};
  if(slug==='start-extra-time') return {label:'Prórroga',color:'var(--gold)',text:'⏱️ ¡A la prórroga! Se juegan 30 minutos más para definir todo.'};
  if(slug==='start-2nd-half-extra-time') return {label:'Prórroga',color:'var(--gold)',text:'⏱️ Arranca el segundo tiempo de la prórroga.'};
  if(slug==='start-shootout') return {label:'Penales',color:'var(--red)',text:'🎯 ¡Se define en la tanda de penales!'};
  if(slug==='halftime') return {label:'Entretiempo',color:'var(--text2)',text:'⏸️ Entretiempo: los equipos se van al vestuario.'};
  if(slug==='halftime-extra-time') return {label:'Descanso',color:'var(--text2)',text:'⏸️ Breve descanso antes del segundo tiempo de la prórroga.'};
  if(slug==='end-regular-time') return {label:'Fin del tiempo',color:'var(--text2)',text:'⌛ Termina el tiempo reglamentario.'};
  if(slug==='end-extra-time') return {label:'Fin prórroga',color:'var(--text2)',text:'⌛ Termina la prórroga.'};
  if(slug==='end-match') return {label:'Final',color:'var(--green)',text:'🏁 ¡Terminó el partido!'};
  if(slug==='start-delay'||slug==='end-delay'){
    if(slug==='end-delay') return {label:'Se reanuda',color:'var(--text2)',text:'▶️ Se reanuda el partido.'};
    if(/drinks/i.test(raw)) return {label:'Pausa',color:'var(--text2)',text:'💧 Pausa para hidratación.'};
    if(/injury/i.test(raw)) return {label:'Pausa',color:'var(--text2)',text:`🚑 Se detiene el juego por una atención médica${team?` a ${team}`:''}.`};
    return {label:'Pausa',color:'var(--text2)',text:'⏱️ Breve interrupción en el partido.'};
  }
  if(slug==='substitution'){
    return {label:'Cambio',color:'#4f46e5',text:`🔄 Cambio en ${team||'el equipo'}: entra ${p1||'un jugador'}, sale ${p2||'otro jugador'}.`};
  }
  if(slug==='yellow-card'){
    return {label:'Amarilla',color:'var(--gold)',text:`🟨 Tarjeta amarilla para ${p1||'un jugador'} de ${team||'el equipo'}.`};
  }
  if(slug==='red-card'||slug==='yellow-red-card'){
    return {label:'Expulsión',color:'var(--red)',text:`🟥 ¡Se va expulsado! ${p1||'El jugador'} deja a ${team||'su equipo'} con uno menos.`};
  }
  if(slug==='own-goal'){
    return {label:'Autogol',color:'var(--red)',text:`😱 ¡Autogol! ${p1||'Un defensor'} de ${team||'el equipo'} manda el balón a su propia portería.`};
  }
  if(slug.startsWith('penalty')){
    if(/saved|missed|off target|hits the (post|bar)/i.test(raw)) return {label:'Penal fallado',color:'var(--red)',text:`🙅 ¡Lo ataja el arquero! ${p1||'El cobrador'} de ${team||'el equipo'} falla desde los once pasos.`};
    if(slug.includes('scored')||ev.scoringPlay){
      const assist=p2?` Asistencia de ${p2}.`:'';
      return {label:'Gol de penal',color:'var(--green)',text:`🥅 ¡GOL DE PENAL! ${p1||'El cobrador'} no perdona y anota para ${team||'su equipo'}.${assist}`};
    }
    return {label:'Penal',color:'var(--gold)',text:`⚠️ ¡Hay penal! Lo cobra ${team||'el equipo'}.`};
  }
  if(slug==='deleted-after-review'){
    return {label:'Gol anulado',color:'var(--red)',text:`🚫 ¡GOL ANULADO! El VAR le apaga la fiesta a ${team||'el equipo'}: la anotación de ${p1||'el jugador'} no vale.`};
  }
  if(slug.startsWith('var-')||slug.includes('referee-decision')){
    const cleaned=raw.replace(/^VAR Decision:\s*/i,'').trim();
    return {label:'VAR',color:'var(--gold)',text:`📺 Revisión del VAR${team?` en ${team}`:''}: ${cleaned||'el árbitro revisa una jugada polémica.'}`};
  }
  if(slug==='offside'){
    return {label:'Fuera de juego',color:'var(--text2)',text:`🚩 Fuera de juego${p1?` de ${p1}`:''}${team?` (${team})`:''}.`};
  }
  if(slug==='handball'){
    return {label:'Mano',color:'var(--red)',text:`✋ Mano de ${p1||'un jugador'}${team?` (${team})`:''}.`};
  }
  if(slug==='foul'){
    return {label:'Falta',color:'var(--red)',text:`⚠️ Falta de ${p1||team||'un jugador'}${team&&p1?` (${team})`:''}${p2?` sobre ${p2}`:''}.`};
  }
  if(slug==='corner-awarded'){
    return {label:'Córner',color:'var(--gold)',text:`🚩 Tiro de esquina para ${team||'el equipo'}.`};
  }
  if(slug==='shot-hit-woodwork'){
    const assist=p2?` (asistencia de ${p2})`:'';
    return {label:'¡Al palo!',color:'var(--gold)',text:`🥶 ¡Pega en el palo! ${p1||'El jugador'} de ${team||'su equipo'} se quedó a centímetros del gol${assist}.`};
  }
  if(slug==='shot-on-target'){
    const assist=p2?` (asistencia de ${p2})`:'';
    return {label:'Remate',color:'var(--gold)',text:`🎯 ¡Remate al arco! ${p1||'El jugador'} de ${team||'su equipo'} obliga a una gran atajada${assist}.`};
  }
  if(slug==='shot-off-target'){
    const assist=p2?` (asistencia de ${p2})`:'';
    return {label:'Remate',color:'var(--text2)',text:`😬 ${p1||'El jugador'} de ${team||'su equipo'} prueba suerte${assist}, pero el remate se va desviado.`};
  }
  if(slug==='shot-blocked'){
    return {label:'Remate',color:'var(--text2)',text:`🛡️ Remate de ${p1||'el jugador'} (${team||'su equipo'}) que termina bloqueado por la defensa.`};
  }
  if(slug==='added-time'){
    const mins=raw.match(/(\d+)\s+minutes?/i);
    return {label:'Tiempo añadido',color:'var(--text2)',text: mins ? `⏱️ El cuarto árbitro añade ${mins[1]} minutos de descuento.` : '⏱️ Anuncian minutos de descuento.'};
  }
  if(slug==='info'){
    if(/lineups are announced/i.test(raw)) return {label:'Info',color:'var(--text2)',text:'📋 Se anuncian las alineaciones, los jugadores hacen el calentamiento.'};
    return {label:'Info',color:'var(--text2)',text: translateEventText(raw) || 'Novedad del partido.'};
  }
  if(slug.startsWith('goal')||ev.scoringPlay){
    const assist=p2?` Asistencia de ${p2}.`:'';
    return {label:'¡GOL!',color:'var(--green)',text:`⚽ ¡GOOOOL DE ${(team||'').toUpperCase()||'ESTE EQUIPO'}! Lo grita ${p1||'todo el estadio'}.${assist}`};
  }
  return {label:'Jugada',color:'var(--text2)',text:translateEventText(raw)||'Jugada del partido.'};
}
function parseEventMinute(minute){
  // -1 para "sin minuto conocido": siempre queda al final tanto ordenando
  // de mas viejo a mas nuevo como al reves, porque ningun minuto real es
  // negativo. Para descuento tipo "90'+4'" se combina el minuto base y el
  // agregado (90*1000+4) para que ordene bien dentro del propio descuento;
  // "&#39;" (apostrofe ya escapado) se vuelve a "'" antes de leer los
  // numeros, porque el "39" del entity se colaba como si fuera un minuto.
  if(!minute) return -1;
  const cleaned=String(minute).replace(/&#39;/g,"'").trim();
  const nums=cleaned.match(/\d+/g);
  if(!nums) return -1;
  const base=Number(nums[0]);
  const extra=nums.length>1 ? Number(nums[1]) : 0;
  return base*1000+extra;
}

// ===== PERSISTENCIA DE VISTA: recuerda la pestaña y el partido en vivo
// abierto para que un refresh de la pagina no te regrese a "Hoy" =====
const VIEW_KEY='wc2026_view_v1';
function saveViewState(){
  try{ localStorage.setItem(VIEW_KEY, JSON.stringify({tab:curTab, matchId:selectedMatchId})); }catch(e){}
}
function loadViewState(){
  try{
    const raw=localStorage.getItem(VIEW_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function openLiveView(id){
  const x=M.find(m=>m.id===id); if(!x)return;
  selectedMatchId=id;
  const tab=document.querySelector('.app-tab[data-tab="live"]');
  if(tab) goTab('live', tab);
  renderLiveView();
  loadMatchDetail(id);
}

function renderLiveView(){
  const host=document.getElementById('live');
  if(!selectedMatchId){ host.innerHTML=`<div class="empty"><i class="bi bi-broadcast" style="font-size:32px;display:block;margin-bottom:8px"></i>Selecciona un partido para ver su vista en vivo.</div>`; return; }
  const x=M.find(m=>m.id===selectedMatchId); if(!x){ host.innerHTML=`<div class="empty">No se encontró el partido.</div>`; return; }
  const lv=liveData[x.id]||''; const meta = x.id ? (liveMeta[x.id] || {}) : {};
  const detail=liveDetails[selectedMatchId]||{};
  const movement=meta.latestAction || meta.summary || '';
  // Si el partido ya termino, se manda siempre el marcador/estado final
  // (x.hr/x.ar + "Final"), sin importar por que via se entero la app de que
  // termino (encuesta en vivo, resultado compartido o localStorage). Antes
  // se miraba primero meta.score/meta.minute, que quedaban pegados en el
  // ultimo dato en vivo cuando el partido se marcaba jugado por otra via
  // (ej. data/results.json) y esta pantalla nunca se enteraba.
  const score = played(x) ? `${x.hr} - ${x.ar}` : (meta.score ? `${meta.score.home} - ${meta.score.away}` : `${gtT(x.time)} GT`);
  const minute = played(x) ? 'Final' : (meta.minute || (detail.minute ? detail.minute : 'Por comenzar'));
  // Cronologia completa del partido (no se recorta). Se muestra con lo mas
  // reciente arriba para que la ultima jugada quede pegada al marcador y no
  // haya que bajar toda la lista para ver que esta pasando ahora mismo.
  const events=[...(detail.events||[])];
  if(minute==='Entretiempo' && !events.some(ev=>ev.slug==='halftime')){
    events.push({minute:'45+',slug:'halftime',team:'',participants:[],text:''});
  }
  events.sort((a,b)=>parseEventMinute(b.minute)-parseEventMinute(a.minute));
  host.innerHTML=`
    <div class="ibox ig"><h3 style="color:var(--green)"><i class="bi bi-broadcast"></i> Vista en vivo</h3><p>Resumen del encuentro con minutos, tarjetas, faltas y jugadas clave.</p></div>
    <div class="mc" style="border-color:rgba(230,57,70,.35)">
      <div class="mc-top"><span class="spill ${STAGE_PILL[x.stage]||'sp-g'}">${STAGE_NAME[x.stage]+(x.group?` · Gr.${x.group}`:'')}</span><span style="font-size:11px;color:var(--text2)">${fmtD(x.date)}</span></div>
      <div class="mc-body">
        <div class="teams">
          <div class="team">${flagImg(x.h)}<div class="tname">${x.h}</div></div>
          <div class="sc-wrap"><div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Estado</div><div class="sc-num" style="font-size:28px">${score}</div><div class="sc-live" style="font-size:12px">${minute}</div></div>
          <div class="team">${flagImg(x.a)}<div class="tname">${x.a}</div></div>
        </div>
        <div class="venue"><i class="bi bi-geo-alt"></i> ${x.venue}</div>
        <div class="sec-ttl">Línea de tiempo del partido</div>
        ${events.length ? `<div class="timeline">${events.map(ev=>{
          const d=describeEvent(ev);
          return `<div class="timeline-item">
            <div class="timeline-head">
              <span class="timeline-min">${ev.minute || '—'}</span>
              <span style="font-size:11px;font-weight:700;color:${d.color}">${d.label}</span>
            </div>
            <div class="timeline-card">
              <div class="timeline-type">${d.label}</div>
              <div class="timeline-text">${d.text}</div>
            </div>
          </div>`;
        }).join('')}</div>` : `<div class="empty" style="padding:14px 0">Aún no hay eventos detallados para este encuentro.</div>`}
        <div class="live-box" style="margin-top:12px">
          <div class="live-box-lbl"><i class="bi bi-chat-square-text-fill"></i> Última actualización</div>
          <div class="live-box-txt">${lv || 'El partido aún no tiene reportes en vivo. Se mostrará la información cuando ESPN la entregue.'}</div>
          ${meta.summary?`<div class="live-box-txt" style="margin-top:6px;font-size:12px;color:var(--text2)">${meta.summary}</div>`:''}
          ${movement?`<div class="live-box-txt" style="margin-top:6px;font-size:12px;color:var(--gold)">Último movimiento: ${movement}</div>`:''}
        </div>
      </div>
    </div>`;
}

async function loadMatchDetail(id){
  const x=M.find(m=>m.id===id); if(!x) return;
  const cached=liveDetails[id];
  if(cached && played(x)) return;
  const match=findEspnMatch(x.h,x.a); if(!match?.id) return;
  try{
    const response=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=${match.id}`,{cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    // "keyEvents" solo trae lo mas relevante (goles, tarjetas, cambios,
    // arranques/pausas). "commentary" es el relato jugada a jugada completo
    // (faltas, corners, remates, fuera de juego, manos, VAR) y comparte el
    // mismo id de jugada que keyEvents, asi que se combinan ambas fuentes.
    const rawEvents=[...(data.keyEvents||[])];
    (data.commentary||[]).forEach(c=>{ if(c.play) rawEvents.push(c.play); });

    // ESPN manda por duplicado los eventos de estado del partido (uno por
    // equipo, ej. las pausas de hidratacion) sin texto en uno de los dos;
    // esos se combinan en uno solo. Los eventos con jugadores (goles,
    // cambios, tarjetas, faltas, remates) nunca se combinan por minuto
    // porque puede haber varios en el mismo minuto (ej. 3 cambios seguidos);
    // en su lugar se deduplican por el id de jugada de ESPN, que "commentary"
    // suele repetir 2 veces con distinto texto narrativo para la misma jugada.
    const MATCH_STATE_SLUGS=new Set(['kickoff','start-2nd-half','start-extra-time','start-2nd-half-extra-time','end-extra-time','end-regular-time','end-match','halftime','halftime-extra-time','start-shootout','start-delay','end-delay']);
    const seen=new Map();
    rawEvents.forEach(ev=>{
      // ev.clock/team/participants/text vienen de ESPN (un tercero): se
      // escapan aqui mismo, al leerlos, para que nunca lleguen sin escapar a
      // un innerHTML mas adelante (describeEvent/renderLiveView).
      const minute=escapeHtml(ev.clock?.displayValue || (ev.clock?.value!=null ? `${ev.clock.value}'` : ''));
      const slug=ev.type?.type || '';
      if(!slug) return;
      const entry={
        minute,
        slug,
        team: escapeHtml(toSpanishTeam(ev.team?.displayName||'')),
        scoringPlay: !!ev.scoringPlay,
        participants: (ev.participants||[]).map(p=>escapeHtml(p.athlete?.displayName)).filter(Boolean),
        text: escapeHtml(toSpanishText(ev.text || ev.shortText || ''))
      };
      const key=MATCH_STATE_SLUGS.has(slug) ? `${slug}|${minute}` : `id:${ev.id}`;
      const prev=seen.get(key);
      if(!prev || (!prev.text && entry.text)) seen.set(key, entry);
    });

    // Anuncios sueltos que solo aparecen en "commentary" sin jugada
    // estructurada (alineaciones, minutos de descuento anunciados por el
    // cuarto arbitro). Se omiten los que ya llegan como jugada estructurada
    // por keyEvents (kickoff/start-2nd-half/halftime/end-regular-time/etc).
    (data.commentary||[]).forEach((c,i)=>{
      if(c.play) return;
      const raw=(c.text||'').trim();
      if(!raw || /half (begins|ends)|match ends/i.test(raw)) return;
      const minute=escapeHtml(c.time?.displayValue||'');
      seen.set(`info|${minute}|${i}`, {
        minute,
        slug: /added time/i.test(raw) ? 'added-time' : 'info',
        team:'',
        scoringPlay:false,
        participants:[],
        text: escapeHtml(toSpanishText(raw))
      });
    });

    const events=[...seen.values()].sort((a,b)=>parseEventMinute(a.minute)-parseEventMinute(b.minute));
    liveDetails[id]={
      minute: fmtClock(match.competitions?.[0]?.status || {}),
      events
    };
    if(curTab==='live') renderLiveView();
  }catch(e){
    console.warn('No se pudo cargar el resumen detallado del partido:', e);
    liveDetails[id]={minute:'',events:[]};
    if(curTab==='live') renderLiveView();
  }
}

// ===== LIVE FETCH =====
async function fetchLive(){
  if(busy)return; busy=true;
  const dot=document.getElementById('dot'),lbt=document.getElementById('liveT');
  dot.className='live-dot spinning'; lbt.textContent='Actualizando...';
  const sharedChanged=await loadSharedResults();
  if(sharedChanged) advanceBracket();

  const today=new Date().toISOString().slice(0,10);
  // Incluye partidos pasados sin resultado: si ESPN no se consultó a tiempo
  // el día del partido, seguimos intentando hasta obtener el resultado real.
  const pending=M.filter(x=>x.date<=today&&!played(x));
  if(!pending.length){
    // Aunque ya no queden partidos pendientes por consultar en el scoreboard,
    // si hay uno abierto en la vista en vivo igual se refresca su cronologia
    // (por si termino justo via el resultado compartido y todavia no se
    // habian traido sus eventos finales).
    if(curTab==='live' && selectedMatchId!=null) await loadMatchDetail(selectedMatchId);
    if(sharedChanged){
      if(curTab==='hoy')renderHoy();
      else if(curTab==='partidos')renderPartidos();
      else if(curTab==='llaves')renderLlaves();
      else if(curTab==='live')renderLiveView();
      else if(curTab==='stats')renderStats();
    }
    dot.className='live-dot pulse';lbt.textContent='EN VIVO';busy=false;return;
  }

  try{
    const dates=[...new Set(pending.map(x=>x.date))];
    let allEvents=[];
    for(const d of dates){
      const dParam=d.replace(/-/g,'');
      const response=await fetch(`${ESPN_SCOREBOARD_URL}?dates=${dParam}`,{cache:'no-store'});
      if(!response.ok) continue;
      const data=await response.json();
      allEvents=allEvents.concat(data.events||[]);
    }
    window.__espnLiveEvents=allEvents;

    let changed=sharedChanged;
    pending.forEach(x=>{
      const match=findEspnMatch(x.h,x.a);
      let msg='';
      let minute=''; let summary=''; let latestAction=''; let score=null; let statusText='';

      if(!match){
        msg=`🕒 ${x.h} vs ${x.a} · Esperando datos de ESPN...`;
      } else {
        const comp=match.competitions?.[0];
        const status=comp?.status?.type||{};
        const homeTeam=comp?.competitors?.find(c=>c.homeAway==='home');
        const awayTeam=comp?.competitors?.find(c=>c.homeAway==='away');
        const homeScore=homeTeam?.score ?? null;
        const awayScore=awayTeam?.score ?? null;
        const state=status.state;
        const period=comp?.status?.period || '';
        // status.detail y lastPlay son texto libre que manda ESPN (un
        // tercero): se escapan aqui, antes de guardarlos en liveData/liveMeta,
        // porque esos campos terminan interpolados en innerHTML mas adelante.
        const detail=escapeHtml(status.detail || '');
        const lastPlay=escapeHtml(comp?.situation?.lastPlay?.text || comp?.situation?.lastPlay?.shortText || '');
        const clockText=fmtClock(comp?.status || {});

        if(homeScore!==null&&awayScore!==null){
          score={home:Number(homeScore),away:Number(awayScore)};
        }

        if(state==='in'){
          const halftimeLike=/halftime|entretiempo|interval|break|descanso/i.test((detail||'').toLowerCase());
          if(halftimeLike){
            msg='⏸️ Entretiempo';
            minute='Entretiempo';
            summary=detail || 'Descanso del partido';
            latestAction=detail || 'Descanso del partido';
          } else {
            minute=clockText ? `${clockText}` : (period ? `Periodo ${period}` : 'En juego');
            statusText=detail || 'en juego';
            msg=`⚽ ${x.h} ${homeScore ?? 0}-${awayScore ?? 0} ${x.a} · ${statusText}`;
            summary=lastPlay || 'El partido sigue muy vivo.';
            latestAction=lastPlay || 'El partido sigue muy vivo.';
          }
        } else if(state==='post'){
          if(homeScore!==null&&awayScore!==null){
            x.hr=Number(homeScore); x.ar=Number(awayScore);
            // En cruces de eliminacion directa empatados, ESPN define el
            // ganador real (tras penales) con "winner" y trae el marcador
            // de la tanda en "shootoutScore" por equipo.
            x.win = homeTeam?.winner===true ? 'h' : (awayTeam?.winner===true ? 'a' : null);
            x.hp = homeTeam?.shootoutScore!=null ? Number(homeTeam.shootoutScore) : null;
            x.ap = awayTeam?.shootoutScore!=null ? Number(awayTeam.shootoutScore) : null;
            saveStoredResult(x);
            ensureHistoryEntry(x);
            const penTxt = x.hr===x.ar && x.hp!=null && x.ap!=null ? ` (pen. ${x.hp}-${x.ap})` : '';
            msg=`🏁 Final: ${x.h} ${homeScore}-${awayScore} ${x.a}${penTxt}`;
            minute='Final';
            summary=detail || 'Partido completado';
            latestAction=detail || 'Partido completado';
          } else {
            msg='🏁 Partido finalizado';
            minute='Final';
            summary=detail || 'Partido completado';
            latestAction=detail || 'Partido completado';
          }
        } else if(state==='pre'){
          msg=`🕒 Próximo · ${detail || 'por disputarse'}`;
          minute='Próximo';
          summary=detail || 'El encuentro está por comenzar';
          latestAction=detail || 'El encuentro está por comenzar';
        }
      }

      if(!msg) msg=`🕒 ${x.h} vs ${x.a} · Sin datos en este momento`;
      if(liveData[x.id]!==msg || liveMeta[x.id]?.minute!==minute || liveMeta[x.id]?.summary!==summary || liveMeta[x.id]?.latestAction!==latestAction){
        liveData[x.id]=msg;
        liveMeta[x.id]={minute,summary,score,latestAction};
        changed=true;
      }
    });

    if(advanceBracket())changed=true;

    // La linea de tiempo (jugada a jugada) solo se cargaba una vez al abrir
    // la vista en vivo; aqui se refresca junto con el resto de datos en vivo.
    // No se limita a "pending": si el resultado final llego por otra via
    // (data/results.json compartido, localStorage) el partido ya figura
    // como jugado y quedaria afuera de "pending", pero loadMatchDetail igual
    // debe correr una ultima vez para traer los eventos finales; su propio
    // guard interno (cache + jugado) evita pedirlo de mas despues de eso.
    if(curTab==='live' && selectedMatchId!=null) await loadMatchDetail(selectedMatchId);

    const now=new Date().toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('lastUpd').textContent=`Actualizado ${now}`;
    if(changed){
      if(curTab==='hoy')renderHoy();
      else if(curTab==='partidos')renderPartidos();
      else if(curTab==='llaves')renderLlaves();
      else if(curTab==='live')renderLiveView();
      else if(curTab==='stats')renderStats();
    }
  }catch(e){
    console.warn('No se pudo cargar el scoreboard de ESPN:', e);
  }

  dot.className='live-dot pulse'; lbt.textContent='EN VIVO'; busy=false;
}

// ===== TAB =====
function goTab(id,el){
  el = el || document.querySelector(`.app-tab[data-tab="${id}"]`);
  document.querySelectorAll('.app-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById(id).classList.add('active');
  curTab=id;
  saveViewState();
  if(id==='hoy')renderHoy();
  else if(id==='partidos')renderPartidos();
  else if(id==='llaves')renderLlaves();
  else if(id==='stats')renderStats();
  else if(id==='live')renderLiveView();
}

// ===== BOOT =====
function refreshDerived(){
  historyMatches=M.filter(x=>played(x)).map(x=>({...x}));
  historyMatches.sort((a,b)=>compareMatchDate(b,a));
  renderHoy(); renderPartidos(); renderLlaves(); renderStats(); renderLiveView();
}
// Restaura la pestaña (y el partido en vivo, si habia uno abierto) desde
// antes de recargar la pagina, en vez de arrancar siempre en "Hoy".
const savedView=loadViewState();
if(savedView && savedView.tab && document.getElementById(savedView.tab)){
  curTab=savedView.tab;
  if(savedView.matchId!=null && M.some(m=>m.id===savedView.matchId)) selectedMatchId=savedView.matchId;
  const savedBtn=document.querySelector(`.app-tab[data-tab="${curTab}"]`);
  document.querySelectorAll('.app-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  if(savedBtn) savedBtn.classList.add('active');
  document.getElementById(curTab).classList.add('active');
  if(curTab==='live' && selectedMatchId!=null) loadMatchDetail(selectedMatchId);
}

loadStoredResults();
advanceBracket();
refreshDerived();

// El resultado compartido (data/results.json, publicado por un workflow de
// GitHub Actions) llega por red: no bloquea el primer render, pero en cuanto
// llega se vuelve a pintar para que todas las visitas queden igual de al dia.
loadSharedResults().then(changed=>{ if(changed){ advanceBracket(); refreshDerived(); } });

setTimeout(fetchLive,1500);
setInterval(fetchLive, 30000);
</script>
